.gsteps span{font-size:1.3rem;margin-right:6px}.gsteps p{margin:4px 0 0;font-size:.86rem;color:var(--mu)}
.faq details{border-bottom:1px solid var(--bd);margin:0;padding:10px 0}.faq details:last-child{border-bottom:0}.faq p{margin:8px 0 0;font-size:.9rem}
.foot{font-size:.78rem;color:var(--mu);text-align:center;margin:14px 0}
/* guide */
.guide{position:fixed;inset:0;z-index:60;background:rgba(5,15,30,.55);display:none;place-items:center;padding:18px}
.guide.on{display:grid}
.gcard{background:var(--card);border-radius:22px;padding:24px 20px 18px;max-width:380px;width:100%;text-align:center;animation:up .25s ease-out;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.gemo{font-size:3rem;width:84px;height:84px;margin:0 auto 6px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,var(--h1),var(--h2))}

.gdots{display:flex;justify-content:center;gap:6px;margin:16px 0}.gdots i{width:8px;height:8px;border-radius:50%;background:var(--bd)}.gdots i.on{background:var(--pri);width:22px;border-radius:4px}
.gbtns{display:flex;gap:8px;justify-content:center}.gbtns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:#13223a;color:#fff;border-radius:999px;padding:9px 16px;font-size:.85rem;opacity:0;transition:.22s;pointer-events:none;z-index:70;white-space:nowrap}
#toast.on{opacity:.96;transform:translate(-50%,0)}
@media (min-width:760px){#toast{bottom:28px}}
#loading{text-align:center;color:var(--mu);padding:50px 0}
.page{display:none}.page.on{display:block}
[hidden]{display:none!important}
.cntrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 2px 6px}.cntrow .count{margin:0}
.subl{margin:4px 0 2px;padding-left:1.1em;list-style:disc;color:var(--mu);font-size:.84rem}.subl li{margin:2px 0}
body.lock #toast{bottom:auto;top:16px;transform:translate(-50%,-10px)}body.lock #toast.on{transform:translate(-50%,0)}
.prow{grid-template-columns:auto 1fr auto auto;grid-template-areas:"av mid sub rm" "av st st rm";gap:4px 8px}
.prow>.av{grid-area:av}.prow>.mid{grid-area:mid}.prow>.sub{grid-area:sub}.prow>.rm{grid-area:rm}.prow>.stepper{grid-area:st;justify-self:start}

.tag.rough{background:#eef0f3;color:#6b7686}.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:.78rem;color:var(--mu)}
.it:focus-visible,.cd:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

/* ---- v4 ---- */
.hero{padding:12px}

.pf{border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;min-width:0;transition:border-color .12s,background .12s}
.pf em{font-style:normal;font-size:1.3rem;line-height:1.15}
.pf b{font-size:.86rem;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf small{font-size:.7rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pf.on{border-color:var(--pri);background:var(--pri2);box-shadow:0 0 0 2px var(--pri2)}
.pf.on b{color:var(--pri)}
.pdesc{margin:8px 2px 0;font-size:.8rem;color:var(--mu)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}

.pill.fx{background:var(--bg);color:var(--mu)}

.cntrow{flex-wrap:wrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tools select{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:5px 8px;font-size:.8rem;font-weight:600}
.tl{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:5px 9px;font-size:.76rem;font-weight:700;color:var(--mu)}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;box-shadow:var(--sh);overflow:hidden}
.gh{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:11px 12px;text-align:left}

.grp.open>.gh .chev{transform:rotate(90deg)}
.gh b{flex:1;min-width:0;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .rng{font-size:.72rem;color:var(--mu);white-space:nowrap;flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.gh .gn{font-size:.72rem;color:var(--pri);background:var(--pri2);border-radius:999px;padding:1px 8px;font-weight:700;flex:none}
.gb{padding:0 8px 8px;border-top:1px solid var(--bd)}
.gb .it{border:0;border-bottom:1px solid var(--bd);border-radius:0;box-shadow:none;margin:0;padding:8px 2px}
.gb .grid{padding-top:8px}.gb .tblwrap{margin-top:8px;box-shadow:none}
.more{grid-column:1/-1;width:100%;border:1px dashed var(--bd);background:var(--bg);color:var(--pri);border-radius:10px;padding:8px;font-weight:700;font-size:.85rem;margin-top:8px}

.tag.col{background:#eef0f3;color:#6b7686}
.tag.rough{background:rgba(239,173,29,.16);color:#9a6a00}
[data-theme=dark] .tag.rough{color:#f0c050}[data-theme=dark] .tag.col{background:#23344a;color:#93a3b8}
/* item sheet */
.prof3{margin-top:8px;border-top:1px solid rgba(0,0,0,.06)}
.prof3 div{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;padding:5px 0;border-bottom:1px dashed var(--bd)}
.prof3 div span{color:var(--mu)}.prof3 div.on span,.prof3 div.on b{color:var(--pri);font-weight:800}
.eld{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.eld span{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:.8rem}
.hx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:.8rem;color:var(--mu);font-weight:700}
.hx .seg button{padding:4px 10px}
.offp{background:var(--bg);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.86rem}
/* pack */
.pgrid{display:grid;gap:0 12px}
@media (min-width:960px){.pgrid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);align-items:start}.pcol2{position:sticky;top:106px}}
.ratcard .rc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ratcard h3{margin:0 0 10px}
.rc-b{display:grid;gap:10px}
@media (min-width:600px){.rc-b{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:stretch}}
.rbig{border-radius:14px;padding:10px 14px;color:#fff;display:flex;flex-direction:column;justify-content:center;min-height:84px}
.rbig b{font-size:1.9rem;line-height:1.1}.rbig small{opacity:.92;font-size:.76rem}.rbig strong{font-size:1rem}
.rbig.none{background:var(--bg);color:var(--mu);font-size:.85rem;border:1px dashed var(--bd);text-align:center}
.rbig.f2p,#ratPill.f2p{background:linear-gradient(135deg,#5468e8,#8a9bff)}
.rc-o{font-size:.8rem;color:var(--mu);margin:8px 0 0}.rc-o b{color:var(--tx)}
.need{grid-area:need;justify-self:end;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;white-space:nowrap;color:var(--mu)}
.need.on{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.prow.off>.av,.prow.off>.mid,.prow.off>.sub,.prow.off>.stepper{opacity:.42}
.prow.off .mid b{text-decoration:line-through}
.prow{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"av mid sub rm" "av st need rm";gap:4px 8px}
@media (min-width:760px){.prow{grid-template-columns:auto minmax(0,1fr) auto auto auto auto;grid-template-areas:"av mid st sub need rm"}}
.prfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.prfoot .hint{margin:0}
.ladder{margin:4px 0 6px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 10px;font-size:.84rem}
.lrow+.lrow{border-top:1px solid var(--bd)}
.lrow.ref{box-shadow:inset 3px 0 0 var(--pri)}
.lrow.me{background:var(--pri);color:#fff;font-weight:800}
.elf{font-size:.84rem;margin:5px 0}
.c0{color:#169a5a!important}.c1{color:#1482f0!important}.c2{color:#a8840f!important}.c3{color:#cf3c43!important}
#ratPill{position:fixed;right:12px;bottom:78px;z-index:24;border:0;border-radius:999px;padding:9px 15px;color:#fff;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.22);display:none}
#ratPill.on{display:block}
@media (min-width:760px){#ratPill{bottom:22px}}
.itab{width:100%;border-collapse:collapse;font-size:.82rem;margin:4px 0 8px}

.itab th:first-child,.itab td:first-child{text-align:left;white-space:normal}
.notes{margin:6px 0 0;padding-left:1.2em;font-size:.84rem;color:var(--mu)}.notes li{margin:3px 0}
.sminp{width:110px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 9px}
details.adv{border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:14px 0}
details.adv summary{font-size:.95rem}
.iosw{overflow-x:auto}

/* ---- v4 additions ---- */
#ratPill.hide{display:none!important}
.prfoot .btn{flex:none;white-space:nowrap}
.flat .it{margin-bottom:7px}
.flat>.more{margin-top:4px}
.elx{display:block;font-size:.72rem;color:var(--pri);margin-top:2px;font-weight:600}
.profseg.sm .pf{padding:6px 3px 5px;border-radius:12px}.profseg.sm .pf em{font-size:1.1rem}.profseg.sm .pf b{font-size:.8rem}.profseg.sm .pf small{font-size:.66rem}

.pill.fx{font-size:.72rem}

@media (min-width:760px){.filters{top:96px}}

<body>
<header class="top"><div class="wrap topin">
  <div class="brand"><span class="logo">FM</span><b id="appName"></b></div>
  <button class="cbtn" id="curBtn" data-act="curpick" data-v="cur" aria-label="currency"></button>
  <button class="ibtn" data-act="lang" aria-label="language">🌐</button>
  <button class="ibtn" data-act="settings" aria-label="settings">⚙️</button>
</div></header>
<nav class="tabs">
  <a href="#list" data-tab="0"><em>📋</em><span></span></a>
  <a href="#pack" data-tab="1"><em>🎁</em><span></span><i></i></a>
  <a href="#help" data-tab="2"><em>❓</em><span></span></a>
</nav>
<main class="wrap">
  <section id="hero" class="card hero"></section>
  <div id="loading">…</div>
  <section id="list" class="page">
    <div class="filters">
      <div class="sbox"><input id="q" type="search" autocomplete="off"><button class="qx" data-act="qclear" aria-label="clear" hidden>✕</button></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="cntrow"><span class="count" id="count"></span><span class="tools" id="tools"></span></div>
    <div id="results"></div>
  </section>
  <section id="pack" class="page">
    <div class="pgrid">
      <div class="pcol">
        <div class="card ratcard" id="ratCard"></div>
        <div class="card">
          <h3 id="st2"></h3>
          <div class="lbl2" id="quickLbl"></div>
          <div class="quick" id="quick"></div>
          <input id="ps" type="search" autocomplete="off">
          <div id="pres"></div>
          <div id="prows"></div>
          <div class="prfoot"><p class="hint" id="needHint"></p><button class="btn sm" id="clearPack" data-act="clearPack"></button></div>
        </div>
        <div class="card">
          <h3 id="st3"></h3>
          <div class="pricerow"><input id="pPrice" type="number" min="0" step="any" inputmode="decimal"><button class="pick" id="pCurBtn" data-act="pcur"></button></div>

        </div>

      </div>
    </div>
  </section>
  <section id="help" class="page"><div id="helpBody"></div></section>
</main>
<button id="ratPill" data-act="toTop"></button>
<div id="sheetWrap" class="sheetwrap"><div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="guide" class="guide"></div>
<div id="toast"></div>
